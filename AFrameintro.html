<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rocket Launch</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-entity position="0 2 6">
        <a-camera>
          <a-cursor></a-cursor>
        </a-camera>
      </a-entity>

      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="directional" position="5 10 7" intensity="1"></a-light>

      <a-plane rotation="-90 0 0" width="20" height="20" color="green"></a-plane>

      <a-sky color="#87CEEB"></a-sky>

      <a-entity id="rocket" position="0 0 0"
        animation__launch="property: position; to: 0 15 0; dur: 4000; easing: ease-in; startEvents: launch">

        <a-cylinder position="0 1 0" radius="0.3" height="2" color="white"></a-cylinder>

        <a-cone position="0 2.5 0" radius-bottom="0.3" height="1" color="red"></a-cone>

        <a-box position="0.4 0.5 0" depth="0.1" height="0.5" width="0.2" color="red"></a-box>
        <a-box position="-0.4 0.5 0" depth="0.1" height="0.5" width="0.2" color="red"></a-box>

        <a-cone id="flame" position="0 -0.8 0" radius-bottom="0.2" height="0.7" color="orange"
          animation="property: scale; to: 1 1.5 1; dir: alternate; dur: 200; loop: true">
        </a-cone>

      </a-entity>

      <a-box position="0 1 -2" color="blue" depth="0.5" height="0.5" width="1"
        event-set__click="_event: click; _target: #rocket; _event: launch">
      </a-box>
      
      <script>
        const rocket = document.querySelector('#rocket');
        let launched = false
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !launched) {
            rocket.emit('launch');
            launched = true
          }
        });
      </script>

    </a-scene>
  </body>
</html>
