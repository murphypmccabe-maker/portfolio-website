<html>
  <head>
    <meta charset="utf-8">


    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <title>A-Frame Starter</title>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" animation="property: rotation; to: 0 0 0 ; loop: true; elasticity:1000; dur: 200" 
      rotation="90 0 0" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-torus position="0 2 -5" animation="property: rotation; to: 0 0 0 ; loop: true; elasticity:1000; dur: 10000" 
      rotation="360 360 0" radius="1.25" color="#AA1A1A"></a-torus>
      <a-cylinder position="1 0.75 -3"animation="property: rotation; to: 0 0 0 ; loop: true; elasticity:1000; dur: 3000" 
      rotation="0 0 360" radius="0.5" height="1.5" color="#EFC65D"></a-cylinder>
      <a-plane position="0 0 -4"  rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-cylinder position="0 5 -5"animation="property: rotation; to: 0 0 0 ; loop: true; elasticity:1000; dur: 3000"
       rotation="360 360 360" radius="0.25" height="2" color="#7A427A"></a-cylinder>
      <a-sky color="#4CC3D9"></a-sky>
    </a-scene>
  </body>
</html>
