<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rocket Launch!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Load A‑Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #000">
    
    <a-entity light="type: ambient; color: #555"></a-entity>
    <a-entity light="type: directional; color: #fff; intensity: 1" position="0 5 -5"></a-entity>

    <a-plane rotation="-90 0 0" width="20" height="20" color="#222"></a-plane>

    <a-entity animation="property: position;
                         to: 0 10 -5;
                         dur: 5000;
                         easing: easeOutQuad;
                         loop: false"
              animation__flame="property: scale;
                                 to: 1 0 1;
                                 dur: 5000;
                                 easing: easeOutQuad;
                                 loop: false"
              position="0 0 0">
      
      <a-entity id="rocket" position="0 0 0">
        <a-cylinder position="0 0.75 0" radius="0.2" height="1.5" color="#ccc"></a-cylinder>
        <a-cone position="0 1.75 0" radius-bottom="0.2" radius-top="0" height="0.5" color="#f00"></a-cone>
        <a-box position="0.25 0.25 0" depth="0.05" height="0.3" width="0.3" color="#f00"></a-box>
        <a-box position="-0.25 0.25 0" depth="0.05" height="0.3" width="0.3" color="#f00"></a-box>
        <a-cone position="0 -0.25 0" radius-bottom="0.15" radius-top="0" height="0.4" color="#ff9900" opacity="0.8"></a-cone>
      </a-entity>
    </a-entity>

    <a-entity camera position="0 2 5" look-controls></a-entity>
  </a-scene>
</body>
</html>
